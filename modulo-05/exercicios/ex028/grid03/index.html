<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            display: grid; 

            grid-template-rows: repeat(2, 1fr) 2fr ;/*Utilizando exemplos dos slides, usando repeat e frações*/
            grid-template-columns: 100px 40% repeat(2, 1fr);/*Usando os exemplos da documentação, misturando valores e colocando um reapeat também*/
            
            grid-auto-flow: column; /*Aqui faz com que os itens do grid ao invés de se organizarem como linha, eles passam a se organizar em colunas.*/

            grid-auto-rows: 80px;/*Exemplo prático de como configurar para que novas linhas tenha o mesmo tamanho que a configurada no template rows. Isso é útil para evitar perda de tempo e ficar muito repetitivo, toda vez você manualmente ficar adicionando uma nova linha com uma nova medida no template rows*/
            grid-auto-columns: 120px;/*Fez a mesma coisa que a propriedade de cima, só que com as colunas*/

            gap: 5px; 

            place-items: normal normal;

            place-content: normal normal;
        }
        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container"> <!--Aqui digitamos div.container = ele criou automaticamente uma div com a classe container-->
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div><!--Aqui digitamos div.item*7 = Ele criou 7 divs com a mesma classe item. PORRA GUANABARA, ENSINASSE ISSO ANTES.-->
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>


</body>
</html>
