<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid; 

            /*grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;*//*Aqui transformas em comentário para fazer a simplificação dele logo abaixo:*/
            grid-template: repeat(3, auto)/ repeat(3, auto);

            gap: 5px; 

            /*align-items: start; 
            justify-items: center;*//*Aqui transformas em comentário para fazer a simplificação dele logo abaixo:*/
            place-items: start center;

            /*align-content: space-between; 
            justify-content: end;*//*Aqui transformas em comentário para fazer a simplificação dele logo abaixo:*/
            place-content: space-between end;
        }
        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container"> <!--Aqui digitamos div.container = ele criou automaticamente uma div com a classe container-->
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div><!--Aqui digitamos div.item*7 = Ele criou 7 divs com a mesma classe item. PORRA GUANABARA, ENSINASSE ISSO ANTES.-->
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
