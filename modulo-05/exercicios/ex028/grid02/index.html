<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            height: 250px;
            display: grid; /*Tranformamos o container de fora em um grid layout*/
            grid-template-columns: auto auto auto;/*Deixamos os itens em 3 colunas*/
            grid-template-rows: auto auto auto;/*Deixamos os itens em 3 linhas*/
            gap: 5px; /*Deixamos espaçamento de 5 px entre itens. Note que foi descontinuado a forma que está no doc, agora só escreve gap*/
            align-items: normal; /*Aqui posicionamos os itens do grid na forma vertical*/
            justify-items: normal;/*Aqui posicionamos os tens do grid na forma horizontal. Lembre-se que é aceito vários valores nessas configurações*/
            align-content: normal; /*Aqui ajustamos o conteúdo dentro do grid de forma vertical*/
            justify-content: normal;/*Aqui ajustamos o conteúdo dentro do grid de forma horizontal*/

            /*UMA OBSERVAÇÃO: Na ferramenta de desenvolvedor podemos visualizar e mexer nas propriedades do grid lá temporariamente.(Muito importante para testes e na hora do desenvolvimento)*/
        }
        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container"> <!--Aqui digitamos div.container = ele criou automaticamente uma div com a classe container-->
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div><!--Aqui digitamos div.item*7 = Ele criou 7 divs com a mesma classe item. PORRA GUANABARA, ENSINASSE ISSO ANTES.-->
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
