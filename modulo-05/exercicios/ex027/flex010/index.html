<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;

            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            flex-basis: 250px;
            flex-shrink: 1; /*Esse é o valor por padrão. Serve para decidir se os elementos irão encolher ou não.*/
            flex-grow: 0; /*Esse é o valor por padrão. Serve para decidir se os elementos irão expandir ou não.*/
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Aqui e o Flex container(O pai)-->
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
    <img src="" alt="">
</body>
</html>
