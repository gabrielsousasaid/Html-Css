<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap-reverse;/*Aqui configuramos como será as quebras dentro da caixa*/
            flex-flow: row wrap; /*ShortHand para os dois atributos acima(Flex-direction e flex-wrap)*/
        }
        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Aqui e o Flex container(O pai)-->
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div> <!--Aqui é o flex itens(O filho)-->
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div> 
    </div>
    <img src="" alt="">
</body>
</html>
