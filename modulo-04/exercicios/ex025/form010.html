<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formuláro</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <div>
            <label for="iano">Em que ano você nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2025" value="2000" oninput="calcIdade()"> <!--Chamando uma função para ser aplicada na tag input number-->
        </div>

        <div>
            <label for="iidade">Sua idade é:</label>
            <output id="iidade">0</output>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>

    <script>
        function calcIdade(){
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
            //Aqui foi a função criada para depois exibir um resultado de saída na tag output vinculada com o id:"iidade"
        } 
    </script>
     <!--EXPLICAÇÃO DO QUE FOI FEITO:

    tag output: Serve para mostrar valores de saída de algum formuário preenchido, por exemplo. Note que foi utilizada algumas funcõeszinhas em Javascript para dar funcionalidade a tag output

    -->
</body>
</html>
