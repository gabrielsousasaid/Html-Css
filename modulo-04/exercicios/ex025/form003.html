<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <div>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
        </div>
        <div>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required value="5">
        </div>
        <div>
            <label for="imes">Período Letivo:</label>
            <input type="month" name="mes" id="imes" value="2020-07">
        </div>
        <div>
            <label for="idia">Dia da Prova:</label>
            <input type="date" name="dia" id="idia" value="2020-07-14">
        </div>
        <div>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora">
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>

     <!--EXPLICAÇÃO DO QUE FOI FEITO:
    
    input type number: Cria uma caixa que aceita apenas números
    input type month: Cria uma caixa para você selecionar mês e ano
    input type data: Cria uma caixa que dá para colocar data completa, com dia mês e ano
    input type time: Cria uma caixa que dá para você selecionar a hora

    Atributo (min e max)- Serviu para determinar o número mínimo que possa ser inserido e o máximo
    Atributo (Step)- Determina o intervalor e aceite que deve seguir a caixa de número, exemplo, se for step 1, ele vai aceitar valores de 1 em 1, se for por exemplo, valor flutuante como 0.2, ele vai aceitar número de 0.2 em 0.2
    Atributo (Value)- Serve para preencher um campo com um valor já pré determinado. Ele anula o placeholder, caso esteja estabelecido na tag.

    -->

    <!--IMPORTANTE! - Esses diferentes tipos de caixa, muitas das vezes não são compatíveis a todos os tipos de navegadores. Creio que é interessante fazer essas modificações de campos de preenchimentos, através de CSS e Javascript-->

</body>
</html>
