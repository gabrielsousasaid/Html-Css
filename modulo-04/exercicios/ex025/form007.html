<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <div>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
                <option value="" selected>---Escolha---</option> <!--Aqui colocamos uma option fora da optgroup, para deixarmos como uma orientação para o usuário clicar na lista e escolher um dos estados do sudeste ou nordeste-->
                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio De Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande Do Norte</option>
                </optgroup>
            </select>
        </div>

        <div>
            <label for="iprof">Profissão:</label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option >Administrador</option><!--Aqui é um exemplo que funciona sem value também.-->
                <option value="CONT">Contabilista</option>
                <option value="DEV">Desenvolvedor</option> <!--Aqui poderiamos deixar sem value definido, que os dados que iriam aparecer e que seriam enviados eras as strings dentro das tags options.-->
                <option value="PROF">Professor</option>
            </datalist>
        </div>

        <div>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    <!--EXPLICAÇÃO DO QUE FOI FEITO:
    
    tag select: Criada para fazer um campo para selecionar valores já pré definidos, como por exemplo no exemplo acima, que criamos uma lista para que seja selecionado um estado do sul e sudeste.
    tag option: Tag utilizada para colocar entre as tags select e datalist para criar opções para o usuário selecionar e enviar os valores que definimos.
    tag optgroup: Uma tag que definine um agrupamento de opções com uma label para nós diferenciarmos e classificarmos as opções de uma determinada tag select por exemplo.
    tag datalist: Utilizada no exemplo acima com um id definido para associarmos a uma input type text por exemplo. Isso cria uma série de opções, sugestões de respostas, atribuidas por nós através das options dentro da tag, para o usuário selecionar. Note que mesmo definindo um datalist, ainda sim o usuário pode digitar uma outra resposta.
    tag text area: Define um campo de texto para que o usuário digita dados de string para responder algo(Caso coloquemos texto entre os fechamentos da tag, definimos um texto a mostra do usuário já pré definido para envio) 
    

    Atributo (selected)- foi utilizado dentro de uma option, para deixar aquela seleção já pré definida ao usuário
    Atributo (list) - Utilizado na tag input type text para poder vincular a datalist criada com um id a tag input, fazendo assim que aparecem as pré definições a serem preenchidas no campo pelo usuário
    Atributo (cols e rows) - Utilizado dentro da tag textarea para pré definir o tamanho da caixa de texto.

    -->
</body>
</html>
