<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocapitalize="on">

        <div>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
                <option value="" selected>---Escolha---</option>
                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio De Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande Do Norte</option>
                </optgroup>
            </select>
        </div>

        <div>
            <label for="iprof">Profissão:</label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option >Administrador</option><!--Aqui é um exemplo que funciona sem value também.-->
                <option value="CONT">Contabilista</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
            </datalist>
        </div>

        <div>
            <label for="imsg">Mensagem:</label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    <!--EXPLICAÇÃO DO QUE FOI FEITO:
    
    tag select: Cria uma caixa para selecionar uma cor e enviar o valor da cor escolhida em código hexadecimal
    input type range: Cria uma caixa para selecionar nível de algo, com valor padrão de 0 a 100
    input type file: Cria uma caixa onde você pode enviar arquivos.

    Atributo (method="post")- foi utilizado no lugar do get, por causa da sua limitação de envio de dados, como colocamos o input file, o usuário pode anexar fotos e os dados são altos, então é necessário utilizar o method="post"
    Atributo (value="#00ff00") - Utilizada para carregar a página já com uma cor pré definida na tag input color
    Atributo (min e max) and (value="2") na tag input type range - o min e max, determina em qual valor o nível de seleção inícia e onde ele termina, alterando o valor padrão de 0 a 100. O value 2, deixa que a página carrega o range já pré definida no valor de número 2.

    -->
</body>
</html>
