<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formuláro</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <div>
            <label for="inum">Número:</label>
            <input type="range" name="num" id="inum" min="0" max="10" value="5" oninput="ival.innerHTML= Number(inum.value)">
            <output id="ival">5</output>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
     <!--EXPLICAÇÃO DO QUE FOI FEITO:

    tag output: Serve para mostrar valores de saída de algum formuário preenchido, por exemplo. Note que foi utilizada algumas funcõeszinhas em Javascript para dar funcionalidade a tag output

    -->
</body>
</html>
