<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }/*Aqui configuras a largura e altura nas CSS. Note que ela é absoluta, apesar de ter configurações dentro da tag iframe, o que prevalece é as CSS.*/
    </style>
</head>
<body>
    <h1>Testando o uso de um Iframe</h1>
    <p>
        Acessando o site do 
        <!--Tamanho padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500px" scolling="no" ><a href="https://www.cursoemvideo.com/">Curso em Vídeo</a></iframe> <!--Aqui utilizamos alguns parametros que são aceitos na tag iframe. O scolling por exemplo aceita volorer como auto, yes e no-->
        
        para aprender a programar.
    </p>
   
    <p>
        O repositório do Guanabara no
        <iframe src="https://gustavoguanabara.github.io/" frameborder="0" height="500px" width="500px"><a href="https://gustavoguanabara.github.io/">GitHub</a></iframe>
        também é bem legal!
    </p>
</body>
</html>
